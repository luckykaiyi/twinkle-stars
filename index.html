<!DOCTYPE html>
<html lang="zh-CN" data-theme="blue">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="打卡挑战" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Twinkle Stars · 打卡挑战</title>
  <style>
    :root {
      --ink: #243a55;
      --muted: #6b8199;
      --card: rgba(255, 255, 255, 0.92);
      --line: rgba(70, 130, 180, 0.14);
      --primary: #4ea1ff;
      --primary-deep: #2f7fe0;
      --accent: #5eb0ff;
      --sun: #ffe27a;
      --bad: #ff8fab;
      --shadow: 0 14px 36px rgba(78, 161, 255, 0.16);
      --radius: 26px;
      --bg0: #dff0ff;
      --bg1: #eef6ff;
      --blob1: #b8e0ff;
      --blob2: #cfe8ff;
      --blob3: #ffe9f3;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --fs-xs: 0.78rem;
      --fs-sm: 0.88rem;
      --fs-md: 1rem;
      --fs-lg: 1.12rem;
      --fs-xl: 1.28rem;
      --fs-2xl: 1.55rem;
      --fs-3xl: 1.9rem;
      --lh-tight: 1.25;
      --lh: 1.5;
    }

    html[data-theme="pink"] {
      --ink: #5a3a48;
      --muted: #9a7a88;
      --line: rgba(230, 120, 160, 0.18);
      --primary: #ff8fb8;
      --primary-deep: #f0639a;
      --accent: #ffb4d0;
      --sun: #ffe3a3;
      --bad: #ff6b8a;
      --shadow: 0 14px 36px rgba(255, 143, 184, 0.2);
      --bg0: #ffeaf3;
      --bg1: #fff5f9;
      --blob1: #ffd0e3;
      --blob2: #ffe0ec;
      --blob3: #fff0d6;
    }
    html[data-theme="green"] {
      --ink: #2a4a3a;
      --muted: #6a8a78;
      --line: rgba(70, 170, 120, 0.18);
      --primary: #3ecf8e;
      --primary-deep: #22b572;
      --accent: #7ee0b0;
      --sun: #ffe27a;
      --bad: #ff8fab;
      --shadow: 0 14px 36px rgba(62, 207, 142, 0.2);
      --bg0: #e5f9ef;
      --bg1: #f3fcf7;
      --blob1: #b8f0d4;
      --blob2: #d4f7e6;
      --blob3: #fff0d8;
    }
    html[data-theme="yellow"] {
      --ink: #5a4a20;
      --muted: #9a8a55;
      --line: rgba(230, 180, 40, 0.22);
      --primary: #f0c42e;
      --primary-deep: #e0a800;
      --accent: #ffe27a;
      --sun: #fff1a8;
      --bad: #ff8fab;
      --shadow: 0 14px 36px rgba(240, 196, 46, 0.22);
      --bg0: #fff6d6;
      --bg1: #fffcef;
      --blob1: #ffe9a0;
      --blob2: #fff0c2;
      --blob3: #e8f4ff;
    }
    html[data-theme="purple"] {
      --ink: #3d2f55;
      --muted: #8474a0;
      --line: rgba(150, 110, 220, 0.2);
      --primary: #9b7aef;
      --primary-deep: #7b56d9;
      --accent: #c4b0ff;
      --sun: #ffe27a;
      --bad: #ff8fab;
      --shadow: 0 14px 36px rgba(155, 122, 239, 0.22);
      --bg0: #efe8ff;
      --bg1: #f7f3ff;
      --blob1: #d8c8ff;
      --blob2: #ebe2ff;
      --blob3: #ffe9f3;
    }

    * { box-sizing: border-box; }
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      height: 100%;
    }
    html, body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 8% -8%, var(--blob1) 0%, transparent 58%),
        radial-gradient(800px 480px at 100% 0%, var(--blob2) 0%, transparent 52%),
        radial-gradient(600px 400px at 70% 100%, var(--blob3) 0%, transparent 45%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      background-attachment: fixed;
    }
    body {
      min-height: 100%;
      min-height: 100dvh;
      padding: calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));
      position: relative;
      overflow-x: hidden;
      font-size: var(--fs-md);
      line-height: var(--lh);
      letter-spacing: 0.01em;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 768px) {
      html { font-size: 17px; }
      body { padding: calc(16px + var(--safe-top)) 20px calc(16px + var(--safe-bottom)); }
    }
    @media (min-width: 1100px) {
      html { font-size: 18px; }
      body { padding: calc(18px + var(--safe-top)) 24px calc(18px + var(--safe-bottom)); }
    }
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(2px);
    }
    body::before {
      width: 120px; height: 120px; left: -20px; top: 18%;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 40px 30px 0 rgba(255, 255, 255, 0.35);
    }
    body::after {
      width: 90px; height: 90px; right: -10px; bottom: 16%;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: -28px 18px 0 color-mix(in srgb, var(--blob1) 70%, white);
    }

    .app {
      position: relative; z-index: 1;
      width: min(1120px, 100%);
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    @media (min-width: 1100px) {
      .app { width: min(1320px, 100%); }
    }
    @media (min-width: 1440px) {
      .app { width: min(1440px, 100%); }
    }

    #childView, #parentView {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    #childView { overflow: hidden; }
    #parentView {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    #childView > .card,
    #parentView > .card { margin-top: 0; }
    #childView > .stars-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* 手机竖屏：尽量利用首屏，星星区吃剩余高度 */
    @media (max-width: 767px) and (orientation: portrait) {
      #childView > .stars-panel {
        flex: 1 1 auto;
        min-height: 0;
      }
      #childView > .stars-panel .days {
        flex: 1;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 8px;
        min-height: 168px;
      }
      #childView .day {
        aspect-ratio: auto;
        height: 100%;
        min-height: 0;
      }
    }

    /* iPad / 桌面竖屏：上下分区铺满 */
    @media (min-width: 768px) and (orientation: portrait) {
      #childView { gap: 16px; }
      #childView > .hero { flex: 0 1 auto; }
      #childView > .stars-panel {
        flex: 1 1 auto;
        min-height: 0;
      }
      #childView > .stars-panel .days {
        flex: 1;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 14px;
        min-height: 0;
      }
      .hero {
        grid-template-columns: 1.15fr 0.95fr;
        align-items: stretch;
      }
      .ring { width: clamp(180px, 22vw, 240px); height: clamp(180px, 22vw, 240px); }
      #childView .day { aspect-ratio: auto; min-height: 0; height: 100%; }
    }

    /* 小平板横屏 */
    @media (min-width: 768px) and (max-width: 899px) and (orientation: landscape) {
      #childView {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: minmax(0, 1fr);
        gap: 12px;
      }
      #childView > .hero,
      #childView > .stars-panel { height: 100%; min-height: 0; }
      .hero { grid-template-columns: 1fr; height: 100%; }
      .progress-ring-wrap { height: 100%; }
      #childView .days {
        flex: 1;
        grid-template-rows: repeat(2, minmax(0, 1fr));
        height: 100%;
        gap: 10px;
      }
      #childView .day { aspect-ratio: auto; height: 100%; }
      .ring { width: clamp(140px, 20vw, 180px); height: clamp(140px, 20vw, 180px); }
    }

    /* 横屏平板 / 宽屏：左右分栏铺满 */
    @media (min-width: 900px) and (orientation: landscape), (min-width: 1200px) {
      #childView {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        gap: 16px;
        align-items: stretch;
      }
      #childView > .hero,
      #childView > .stars-panel {
        height: 100%;
        min-height: 0;
        flex: unset;
      }
      .hero {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100%;
      }
      .progress-ring-wrap { min-height: 0; height: 100%; }
      .ring { width: clamp(170px, 18vw, 230px); height: clamp(170px, 18vw, 230px); }
      #childView > .stars-panel .days {
        flex: 1;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 12px;
        height: 100%;
        min-height: 0;
      }
      #childView .day { aspect-ratio: auto; height: 100%; min-height: 0; }

      #parentView {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: minmax(0, auto);
        gap: 16px;
        align-content: start;
      }
      #parentView > .card:first-child,
      #parentView > .card:nth-child(4) { grid-column: 1 / -1; }
      #parentView .days {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }

    /* 手机横屏：尽量单屏 */
    @media (max-height: 480px) and (orientation: landscape) {
      body { padding: 8px 10px; }
      .topbar { margin-bottom: 8px; }
      .brand p { display: none; }
      #childView {
        display: grid;
        grid-template-columns: 1fr 1.1fr;
        gap: 10px;
      }
      #childView > .hero,
      #childView > .stars-panel { height: 100%; min-height: 0; }
      .hero { gap: 8px; }
      .ring { width: 110px; height: 110px; }
      #childView .days {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        height: 100%;
        gap: 6px;
      }
      #childView .day { aspect-ratio: auto; height: 100%; border-radius: 12px; gap: 1px; }
      .card { padding: 12px; border-radius: 18px; }
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 12px; flex-shrink: 0;
    }
    .brand h1 {
      margin: 0; font-size: clamp(1.28rem, 2.6vw, 1.72rem);
      font-weight: 700; letter-spacing: 0.02em; line-height: var(--lh-tight);
    }
    .brand p {
      margin: 4px 0 0; color: var(--muted);
      font-size: var(--fs-sm); line-height: 1.4;
    }
    .mode-switch {
      display: inline-flex; background: var(--card); border: 1px solid var(--line);
      border-radius: 999px; padding: 4px; box-shadow: var(--shadow); flex-shrink: 0;
    }
    .mode-switch button {
      border: 0; background: transparent; padding: 9px 16px; border-radius: 999px;
      font-size: var(--fs-sm); font-weight: 600; color: var(--muted); cursor: pointer;
    }
    .mode-switch button.active {
      background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 85%, white), var(--primary));
      color: #fff;
      box-shadow: 0 4px 12px color-mix(in srgb, var(--primary) 40%, transparent);
    }

    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px; backdrop-filter: blur(8px);
    }
    @media (min-width: 768px) {
      .card { padding: 20px; }
    }
    .section-title {
      display: block; margin: 0 0 6px;
      font-size: var(--fs-lg); font-weight: 700; letter-spacing: 0.01em; line-height: var(--lh-tight);
    }
    .section-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 10px; margin-bottom: 12px; flex-shrink: 0;
    }
    .section-head .meta {
      color: var(--muted); font-size: var(--fs-xs); line-height: 1.35; text-align: right;
    }
    .hidden { display: none !important; }

    .hero { display: grid; gap: 14px; align-content: start; }

    .reward-box {
      background: linear-gradient(145deg, #fff 0%, color-mix(in srgb, var(--blob2) 60%, white) 100%);
      border-radius: 22px; padding: 16px 18px;
      border: 2px dashed color-mix(in srgb, var(--primary) 45%, transparent);
    }
    .reward-box .label {
      font-size: var(--fs-xs); color: var(--muted); margin-bottom: 6px;
      font-weight: 600; letter-spacing: 0.04em;
    }
    .reward-box .name {
      font-size: clamp(1.28rem, 3vw, 1.75rem); font-weight: 700;
      color: var(--primary-deep); word-break: break-word; line-height: var(--lh-tight);
    }

    .progress-ring-wrap {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 8px 0 4px;
    }
    .ring-caption { color: var(--muted); font-size: var(--fs-sm); font-weight: 500; }
    .ring { width: clamp(140px, 38vw, 180px); height: clamp(140px, 38vw, 180px); position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .bg { stroke: color-mix(in srgb, var(--primary) 18%, transparent); }
    .ring .fg {
      stroke: var(--primary); stroke-linecap: round; transition: stroke-dashoffset 0.6s ease;
      filter: drop-shadow(0 2px 6px color-mix(in srgb, var(--primary) 40%, transparent));
    }
    .ring .center {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    }
    .ring .center strong {
      display: block; font-size: var(--fs-3xl); line-height: 1; font-weight: 700;
      letter-spacing: -0.02em;
    }
    .ring .center span { font-size: var(--fs-sm); color: var(--muted); font-weight: 500; }

    .days {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;
      min-height: 0;
    }
    .day {
      aspect-ratio: 1; border-radius: 16px; border: 2px solid var(--line); background: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 4px; position: relative; min-width: 0;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .day .n {
      font-size: clamp(0.72rem, 1.6vw, 0.9rem); color: var(--muted);
      font-weight: 600; line-height: 1.1;
    }
    .day .d {
      font-size: clamp(0.66rem, 1.4vw, 0.8rem);
      color: color-mix(in srgb, var(--muted) 88%, white); line-height: 1.1;
    }
    .day .icon { font-size: clamp(1.4rem, 3.2vw, 2rem); line-height: 1; font-weight: 700; }
    .day .icon.star-off { color: #c9d8ea; }
    .day .icon.star-on {
      color: #ffd000; -webkit-text-fill-color: #ffd000;
      filter: drop-shadow(0 0 3px #fff6a0) drop-shadow(0 0 8px rgba(255, 208, 0, 1)) drop-shadow(0 0 14px rgba(255, 180, 0, 0.85));
      text-shadow: 0 1px 0 #e6a800;
      animation: shine 1.8s ease-in-out infinite;
    }
    .day.todo { opacity: 0.92; background: linear-gradient(160deg, #fff, color-mix(in srgb, var(--blob2) 50%, white)); }
    .day.done {
      background: linear-gradient(160deg, #fff8d6, #ffe9a8);
      border-color: rgba(255, 196, 0, 0.65);
      box-shadow: 0 6px 16px rgba(255, 196, 0, 0.28);
    }
    .day.today { box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent); }
    .day.done.today {
      box-shadow: 0 0 0 3px rgba(255, 196, 0, 0.4), 0 6px 16px rgba(255, 196, 0, 0.28);
    }
    .day.parent-cell { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    .day.parent-cell:active { transform: scale(0.96); }
    .day.pop { animation: pop 0.45s ease; }
    @keyframes pop {
      0% { transform: scale(0.8); }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    @keyframes shine {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 210, 0, 0.9)) drop-shadow(0 0 10px rgba(255, 196, 0, 0.7)); }
      50% { filter: drop-shadow(0 0 8px rgba(255, 230, 120, 1)) drop-shadow(0 0 16px rgba(255, 200, 0, 0.95)); }
    }

    .status-banner {
      margin-top: 12px; padding: 13px 15px; border-radius: 16px;
      background: color-mix(in srgb, var(--primary) 14%, white);
      color: var(--primary-deep); font-size: var(--fs-sm); line-height: 1.55;
    }
    .status-banner.warn {
      background: color-mix(in srgb, var(--sun) 35%, white); color: #8a6a10;
    }
    .status-banner.win {
      background: linear-gradient(120deg, color-mix(in srgb, var(--primary) 18%, white), color-mix(in srgb, var(--sun) 35%, white));
      color: var(--primary-deep); font-weight: 700; font-size: var(--fs-md);
    }

    .btn {
      appearance: none; border: 0; border-radius: 14px; padding: 13px 16px;
      font-size: var(--fs-md); font-weight: 600; cursor: pointer; line-height: 1.2;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 80%, white), var(--primary));
      color: #fff; box-shadow: 0 8px 18px color-mix(in srgb, var(--primary) 35%, transparent);
    }
    .btn-secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .btn-sun {
      background: linear-gradient(180deg, #ffe99a, #ffd95c); color: #6a5208;
      box-shadow: 0 6px 14px rgba(255, 217, 92, 0.35);
    }
    .btn-row, .parent-toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .parent-toolbar { margin-top: 0; margin-bottom: 12px; }
    .btn-row .btn, .parent-toolbar .btn { flex: 1 1 140px; }

    label.field {
      display: grid; gap: 7px; margin-bottom: 14px;
      font-size: var(--fs-sm); font-weight: 600; color: var(--muted);
    }
    label.field input, label.field textarea, label.field select {
      width: 100%; border: 1px solid var(--line); border-radius: 12px;
      padding: 13px 14px; font-size: var(--fs-md); font-weight: 500;
      color: var(--ink); background: #fff; font-family: inherit; line-height: 1.3;
    }
    .theme-grid {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px;
    }
    .theme-chip {
      border: 2px solid var(--line); border-radius: 14px; padding: 11px 6px; background: #fff;
      cursor: pointer; text-align: center; font-size: var(--fs-xs); font-weight: 600; color: var(--ink);
    }
    .theme-chip.active { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); font-weight: 700; }
    .theme-dot {
      width: 18px; height: 18px; border-radius: 50%; margin: 0 auto 6px; display: block;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7);
    }

    .hint {
      font-size: var(--fs-sm); color: var(--muted); line-height: 1.55;
      margin: 0 0 14px;
    }
    .skin-label {
      font-size: var(--fs-sm); font-weight: 600; color: var(--muted); margin: 0 0 8px;
    }
    .empty { text-align: center; padding: 28px 12px; color: var(--muted); font-size: var(--fs-sm); }
    .days .empty { grid-column: 1 / -1; }
    .empty strong {
      color: var(--ink); display: block; margin-bottom: 8px;
      font-size: var(--fs-lg); font-weight: 700;
    }

    .toast-host {
      position: fixed; left: 50%; bottom: calc(28px + var(--safe-bottom));
      transform: translateX(-50%);
      z-index: 90; display: flex; flex-direction: column; align-items: center;
      gap: 8px; pointer-events: none; width: min(420px, calc(100% - 24px));
    }
    .toast {
      pointer-events: none; width: 100%;
      padding: 12px 16px; border-radius: 16px;
      background: rgba(36, 58, 85, 0.92); color: #fff;
      font-size: var(--fs-sm); font-weight: 600; line-height: 1.45;
      text-align: center; box-shadow: 0 10px 28px rgba(36, 58, 85, 0.22);
      backdrop-filter: blur(10px);
      opacity: 0; transform: translateY(10px) scale(0.98);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0) scale(1); }
    .toast.ok { background: color-mix(in srgb, var(--primary-deep) 88%, #243a55); }
    .toast.warn { background: rgba(138, 106, 16, 0.92); }
    .toast.err { background: color-mix(in srgb, var(--bad) 82%, #5a2030); }

    .ask-mask {
      position: fixed; inset: 0; z-index: 85;
      display: grid; align-items: end; justify-items: center;
      padding: 16px; padding-bottom: calc(16px + var(--safe-bottom));
      background: rgba(20, 30, 34, 0.28);
    }
    .ask-sheet {
      width: min(420px, 100%); background: #fff; border-radius: 22px;
      padding: 20px 18px 16px; box-shadow: var(--shadow); text-align: center;
      animation: ask-up 0.22s ease;
    }
    @keyframes ask-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ask-sheet p {
      margin: 0 0 16px; color: var(--ink); font-size: var(--fs-md);
      font-weight: 600; line-height: 1.5;
    }
    .ask-actions { display: flex; gap: 10px; }
    .ask-actions .btn { flex: 1; }

    .modal-mask, .cert-mask {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 50;
      background: rgba(20, 30, 34, 0.45);
    }
    .cert-mask { z-index: 60; background: rgba(20, 30, 34, 0.55); overflow: auto; }
    .modal {
      width: min(360px, 100%); background: #fff; border-radius: 22px; padding: 24px 22px 20px;
      box-shadow: var(--shadow); text-align: center;
    }
    .modal h3 { margin: 0 0 6px; font-size: var(--fs-xl); font-weight: 700; }
    .modal p { margin: 0 0 18px; color: var(--muted); font-size: var(--fs-sm); line-height: 1.5; }
    .code-boxes {
      display: flex; justify-content: center; gap: 12px; margin: 0 0 12px;
    }
    .code-boxes input {
      width: 52px; height: 60px; border: 2px solid var(--line); border-radius: 14px;
      text-align: center; font-size: 1.55rem; font-weight: 700; color: var(--ink);
      background: #fff; font-family: inherit; caret-color: var(--primary);
      -moz-appearance: textfield;
    }
    .code-boxes input::-webkit-outer-spin-button,
    .code-boxes input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .code-boxes input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
    }
    .code-boxes.shake { animation: code-shake 0.35s ease; }
    @keyframes code-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .lock-error {
      min-height: 1.3em; margin: 0 0 14px; color: var(--bad);
      font-size: var(--fs-sm); font-weight: 600;
    }
    .modal-actions { display: flex; justify-content: center; }
    .modal-actions .btn { min-width: 120px; }
    .code-set .code-boxes { justify-content: flex-start; margin-bottom: 14px; }
    .code-set .code-boxes input { width: 48px; height: 54px; font-size: 1.35rem; }
    .cert-panel { width: min(560px, 100%); display: grid; gap: 14px; }
    #certCanvas { width: 100%; height: auto; border-radius: 16px; box-shadow: var(--shadow); background: #fff; }
    .cert-actions {
      display: flex; gap: 10px; align-items: stretch;
    }
    .cert-actions .btn {
      flex: 1 1 0; white-space: nowrap; padding: 13px 12px;
      font-size: clamp(0.92rem, 3.2vw, 1rem);
    }
    .cert-actions .btn-primary { flex: 1.35 1 0; }
    .cert-hint { color: #fff !important; text-align: center; margin: 0; font-size: var(--fs-sm); opacity: 0.92; }
    .confetti { pointer-events: none; position: fixed; inset: 0; overflow: hidden; z-index: 70; }
    .confetti i {
      position: absolute; top: -10px; width: 8px; height: 14px; border-radius: 2px;
      animation: fall linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <h1 id="mainTitle">打卡挑战 ☁️</h1>
        <p id="subtitle">一点点完成，星星会发光哦</p>
      </div>
      <div class="mode-switch" role="tablist">
        <button type="button" id="btnChild" class="active">宝宝</button>
        <button type="button" id="btnParent">家长</button>
      </div>
    </div>

    <section id="childView">
      <div class="card hero">
        <div>
          <div class="reward-box">
            <div class="label">目标奖励</div>
            <div class="name" id="childReward">—</div>
          </div>
          <div class="status-banner" id="childBanner">先在家长页发布任务吧</div>
          <div class="btn-row" id="childActions"></div>
        </div>
        <div class="progress-ring-wrap">
          <div class="ring" aria-hidden="true">
            <svg viewBox="0 0 120 120">
              <circle class="bg" cx="60" cy="60" r="52" fill="none" stroke-width="10" />
              <circle class="fg" id="ringFg" cx="60" cy="60" r="52" fill="none" stroke-width="10"
                stroke-dasharray="326.73" stroke-dashoffset="326.73" />
            </svg>
            <div class="center">
              <div>
                <strong id="streakNum">0</strong>
                <span>/ <span id="goalNum">10</span> 天</span>
              </div>
            </div>
          </div>
          <div class="ring-caption">当前连续完成</div>
        </div>
      </div>
      <div class="card stars-panel">
        <div class="section-head">
          <strong class="section-title" style="margin:0;">星星进度</strong>
          <span class="meta" id="rangeText"></span>
        </div>
        <div class="days" id="childDays"></div>
      </div>
    </section>

    <section id="parentView" class="hidden">
      <div class="card">
        <strong class="section-title">宝宝与皮肤</strong>
        <p class="hint">昵称会用在鼓励文案和奖状里。皮肤立刻作用于整页配色。</p>
        <label class="field">宝宝昵称
          <input id="babyName" type="text" maxlength="20" placeholder="例如：小宝子" />
        </label>
        <div class="skin-label">皮肤风格</div>
        <div class="theme-grid" id="themeGrid">
          <button type="button" class="theme-chip" data-theme="blue"><span class="theme-dot" style="background:#4ea1ff"></span>蓝色</button>
          <button type="button" class="theme-chip" data-theme="pink"><span class="theme-dot" style="background:#ff8fb8"></span>粉色</button>
          <button type="button" class="theme-chip" data-theme="green"><span class="theme-dot" style="background:#3ecf8e"></span>绿色</button>
          <button type="button" class="theme-chip" data-theme="yellow"><span class="theme-dot" style="background:#f0c42e"></span>黄色</button>
          <button type="button" class="theme-chip" data-theme="purple"><span class="theme-dot" style="background:#9b7aef"></span>紫色</button>
        </div>
        <div class="btn-row" style="margin-top:0;">
          <button type="button" class="btn btn-primary" id="saveProfile">保存宝宝设置</button>
        </div>
      </div>

      <div class="card">
        <strong class="section-title">任务设置</strong>
        <p class="hint">连续打卡：未点亮的天数不计入连续。任务内容写在名称里即可。</p>
        <label class="field">任务名称
          <input id="taskTitle" type="text" maxlength="40" placeholder="例如：夜间不尿床挑战" />
        </label>
        <label class="field">奖励名称
          <input id="rewardName" type="text" maxlength="40" placeholder="例如：心仪的玩具" />
        </label>
        <label class="field">开始日期
          <input id="startDate" type="date" />
        </label>
        <label class="field">连续天数
          <input id="goalDays" type="number" min="3" max="60" value="10" />
        </label>
        <p class="hint" id="rangePreview"></p>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="saveTask">保存任务</button>
          <button type="button" class="btn btn-secondary" id="resetAll">清空全部数据</button>
        </div>
      </div>

      <div class="card">
        <strong class="section-title">每日打卡</strong>
        <p class="hint">点格子点亮星星＝当天完成；再点一下＝取消当格。全部清空请用「一键清除」。</p>
        <div class="parent-toolbar">
          <button type="button" class="btn btn-sun" id="fillAllOk">一键打满</button>
          <button type="button" class="btn btn-secondary" id="clearAllMarks">一键清除</button>
        </div>
        <div class="days" id="parentDays"></div>
      </div>

      <div class="card">
        <strong class="section-title">家长设置</strong>
        <div class="code-set">
          <div class="skin-label">设置童锁（4 位数字，默认 1234）</div>
          <div class="code-boxes" id="lockSetBoxes">
            <input class="lock-set-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="童锁第1位" />
            <input class="lock-set-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="童锁第2位" />
            <input class="lock-set-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="童锁第3位" />
            <input class="lock-set-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="童锁第4位" />
          </div>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-secondary" id="saveLock">保存童锁</button>
          <button type="button" class="btn btn-sun" id="previewCert">预览奖状</button>
        </div>
      </div>
    </section>
  </div>

  <div class="modal-mask hidden" id="lockModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
      <h3 id="lockTitle">童锁</h3>
      <p>输入 4 位数字进入家长页</p>
      <div class="code-boxes" id="lockBoxes">
        <input class="lock-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="第1位" />
        <input class="lock-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="第2位" />
        <input class="lock-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="第3位" />
        <input class="lock-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="第4位" />
      </div>
      <p class="lock-error" id="lockError" aria-live="polite"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="lockCancel">取消</button>
      </div>
    </div>
  </div>

  <div class="cert-mask hidden" id="certModal">
    <div class="cert-panel">
      <canvas id="certCanvas" width="1080" height="1520"></canvas>
      <div class="cert-actions">
        <button type="button" class="btn btn-primary" id="saveCert">保存奖状</button>
        <button type="button" class="btn btn-secondary" id="closeCert">关闭</button>
      </div>
      <p class="hint cert-hint">保存后可在系统相册中查看；也可长按奖状图片保存。</p>
    </div>
  </div>

  <div class="confetti hidden" id="confetti"></div>
  <div class="toast-host" id="toastHost" aria-live="polite"></div>
  <div class="ask-mask hidden" id="askMask" role="dialog" aria-modal="true">
    <div class="ask-sheet">
      <p id="askText"></p>
      <div class="ask-actions">
        <button type="button" class="btn btn-secondary" id="askCancel">取消</button>
        <button type="button" class="btn btn-primary" id="askOk">确定</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "twinkle-stars-v1";
    const CIRC = 2 * Math.PI * 52;
    const THEMES = ["blue", "pink", "green", "yellow", "purple"];
    const DEFAULT_NICKNAME = "小宝子";
    const DEFAULT_LOCK_CODE = "1234";

    const defaultState = () => ({
      lockCode: DEFAULT_LOCK_CODE,
      theme: "blue",
      profile: { nickname: DEFAULT_NICKNAME },
      task: null,
    });

    let state = load();
    let mode = "child";
    let parentUnlocked = false;

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        const nickname = ((parsed.profile && parsed.profile.nickname) || "").trim() || DEFAULT_NICKNAME;
        return {
          ...defaultState(),
          ...parsed,
          profile: { nickname },
        };
      } catch {
        return defaultState();
      }
    }
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    let askResolver = null;
    function toast(message, type = "ok") {
      const host = document.getElementById("toastHost");
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      el.textContent = message;
      host.appendChild(el);
      requestAnimationFrame(() => el.classList.add("show"));
      const life = type === "err" || type === "warn" ? 2600 : 2000;
      setTimeout(() => {
        el.classList.remove("show");
        setTimeout(() => el.remove(), 240);
      }, life);
    }
    function askConfirm(message) {
      return new Promise((resolve) => {
        if (askResolver) askResolver(false);
        askResolver = resolve;
        document.getElementById("askText").textContent = message;
        document.getElementById("askMask").classList.remove("hidden");
      });
    }
    function closeAsk(result) {
      document.getElementById("askMask").classList.add("hidden");
      if (askResolver) {
        const r = askResolver;
        askResolver = null;
        r(result);
      }
    }

    function babyName() {
      const n = (state.profile?.nickname || "").trim();
      return n || DEFAULT_NICKNAME;
    }

    function applyTheme(theme) {
      const t = THEMES.includes(theme) ? theme : "blue";
      state.theme = t;
      document.documentElement.setAttribute("data-theme", t);
      document.querySelectorAll(".theme-chip").forEach((el) => {
        el.classList.toggle("active", el.getAttribute("data-theme") === t);
      });
    }

    function todayStr() {
      const d = new Date();
      return fmt(d);
    }
    function fmt(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }
    function parseDate(s) {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    function addDays(s, n) {
      const d = parseDate(s);
      d.setDate(d.getDate() + n);
      return fmt(d);
    }
    function dateList(start, days) {
      const list = [];
      for (let i = 0; i < days; i++) list.push(addDays(start, i));
      return list;
    }
    function weekday(s) {
      return ["日", "一", "二", "三", "四", "五", "六"][parseDate(s).getDay()];
    }
    function shortDate(s) {
      const d = parseDate(s);
      return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    function calcStreak(task) {
      if (!task) return 0;
      const marks = task.marks || {};
      let streak = 0;
      for (let i = 0; i < task.goalDays; i++) {
        if (marks[addDays(task.startDate, i)] === "ok") streak += 1;
        else break;
      }
      return streak;
    }

    function currentRoundSlots(task) {
      if (!task) return [];
      return dateList(task.startDate, task.goalDays).map((date, idx) => ({
        date,
        index: idx + 1,
      }));
    }

    function checkComplete(task) {
      return !!(task && calcStreak(task) >= task.goalDays);
    }

    function ensureCompleteFlag() {
      const task = state.task;
      if (!task) return false;
      if (checkComplete(task) && !task.completedAt) {
        task.completedAt = new Date().toISOString();
        save();
        return true;
      }
      if (!checkComplete(task) && task.completedAt) {
        task.completedAt = null;
        save();
      }
      return false;
    }

    function updateChromeCopy() {
      const name = babyName();
      document.getElementById("mainTitle").textContent = `${name}的打卡挑战 ☁️`;
      document.getElementById("subtitle").textContent = `${name}加油！点亮星星兑奖励～`;
      document.title = `${name}的打卡挑战 · Twinkle Stars`;
    }

    function render() {
      applyTheme(state.theme);
      updateChromeCopy();
      document.getElementById("childView").classList.toggle("hidden", mode !== "child");
      document.getElementById("parentView").classList.toggle("hidden", mode !== "parent");
      document.getElementById("btnChild").classList.toggle("active", mode === "child");
      document.getElementById("btnParent").classList.toggle("active", mode === "parent");
      if (mode === "parent") renderParent();
      renderChild();
    }

    function buildDayCell(slot, task, interactive) {
      const mark = task.marks?.[slot.date];
      const el = document.createElement("div");
      el.className = "day";
      if (interactive) el.classList.add("parent-cell");

      let iconClass = "icon star-off";
      let icon = "☆";
      if (mark === "ok") {
        el.classList.add("done");
        iconClass = "icon star-on";
        icon = "★";
      } else {
        el.classList.add("todo");
      }
      if (slot.date === todayStr()) el.classList.add("today");

      el.innerHTML = `<span class="${iconClass}">${icon}</span><span class="n">第${slot.index}天</span><span class="d">${shortDate(slot.date)}</span>`;
      if (interactive) {
        el.title = `${slot.date} 周${weekday(slot.date)}`;
        el.addEventListener("click", () => cycleMark(slot.date));
      }
      return el;
    }

    function cycleMark(date) {
      if (!state.task) return;
      if (!state.task.marks) state.task.marks = {};
      if (state.task.marks[date] === "ok") delete state.task.marks[date];
      else state.task.marks[date] = "ok";

      const justWon = ensureCompleteFlag();
      save();
      render();
      if (state.task.marks[date] === "ok") {
        document.querySelectorAll("#parentDays .day.done").forEach((c) => {
          if (c.querySelector(".d")?.textContent === shortDate(date)) c.classList.add("pop");
        });
      }
      if (justWon) {
        burstConfetti();
        setTimeout(() => showCertificate(true), 350);
      }
    }

    function renderChild() {
      const task = state.task;
      const name = babyName();
      const banner = document.getElementById("childBanner");
      const actions = document.getElementById("childActions");
      actions.innerHTML = "";

      if (!task) {
        document.getElementById("childReward").textContent = "还没有任务";
        document.getElementById("streakNum").textContent = "0";
        document.getElementById("goalNum").textContent = "10";
        document.getElementById("rangeText").textContent = "";
        document.getElementById("childDays").innerHTML =
          `<div class="empty"><strong>星星还在睡觉</strong>请先在家长页发布任务</div>`;
        setRing(0, 10);
        banner.className = "status-banner warn";
        banner.textContent = `先切换到「家长」发布任务，再回来看${name}的进度哦。`;
        return;
      }

      const streak = calcStreak(task);
      const slots = currentRoundSlots(task);
      document.getElementById("childReward").textContent = task.reward || "神秘奖励";
      document.getElementById("streakNum").textContent = String(streak);
      document.getElementById("goalNum").textContent = String(task.goalDays);
      document.getElementById("rangeText").textContent = `${task.title || "打卡挑战"} · 目标 ${task.goalDays} 天`;
      setRing(streak, task.goalDays);

      const daysEl = document.getElementById("childDays");
      daysEl.innerHTML = "";
      slots.forEach((slot) => daysEl.appendChild(buildDayCell(slot, task, false)));

      if (checkComplete(task)) {
        banner.className = "status-banner win";
        banner.textContent = `${name}太厉害啦！「${task.title}」连续 ${task.goalDays} 天完成，可以兑换「${task.reward}」喽！`;
        const b = document.createElement("button");
        b.className = "btn btn-sun";
        b.textContent = "查看奖状";
        b.onclick = () => showCertificate(true);
        actions.appendChild(b);
      } else {
        banner.className = "status-banner";
        const left = task.goalDays - streak;
        banner.textContent = streak === 0
          ? `${name}完成「${task.title}」就能点亮星星～连续 ${task.goalDays} 天可兑奖励哦。`
          : `${name}已经连续 ${streak} 天啦！再坚持 ${left} 天，星星就集齐咯！`;
      }
    }

    function setRing(streak, goal) {
      const fg = document.getElementById("ringFg");
      const ratio = goal ? Math.min(streak / goal, 1) : 0;
      fg.style.strokeDasharray = String(CIRC);
      if (ratio >= 1) {
        fg.style.strokeDashoffset = "0";
        fg.style.strokeLinecap = "butt";
      } else {
        fg.style.strokeDashoffset = String(CIRC * (1 - ratio));
        fg.style.strokeLinecap = "round";
      }
    }

    function renderParent() {
      const task = state.task;
      document.getElementById("babyName").value = state.profile.nickname || "";

      if (task) {
        document.getElementById("taskTitle").value = task.title || "";
        document.getElementById("rewardName").value = task.reward || "";
        document.getElementById("startDate").value = task.startDate || "";
        document.getElementById("goalDays").value = task.goalDays || 10;
      } else if (!document.getElementById("startDate").value) {
        document.getElementById("startDate").value = todayStr();
      }
      updateRangePreview();
      renderParentDays();
      clearCodeBoxes(document.querySelectorAll(".lock-set-digit"));
    }

    function updateRangePreview() {
      const start = document.getElementById("startDate").value;
      const days = Number(document.getElementById("goalDays").value || 0);
      const el = document.getElementById("rangePreview");
      if (!start || !days) {
        el.textContent = "选择开始日期和天数后，将自动计算首轮日期范围。";
        return;
      }
      const end = addDays(start, days - 1);
      el.textContent = `首轮计划：${start}（周${weekday(start)}）→ ${end}（周${weekday(end)}），共 ${days} 天。`;
    }

    function renderParentDays() {
      const wrap = document.getElementById("parentDays");
      const task = state.task;
      if (!task) {
        wrap.innerHTML = `<div class="empty"><strong>还没有任务</strong>先填写上方信息并保存</div>`;
        return;
      }
      wrap.innerHTML = "";
      currentRoundSlots(task).forEach((slot) => wrap.appendChild(buildDayCell(slot, task, true)));
    }

    async function fillAllOk() {
      const task = state.task;
      if (!task) return toast("请先保存任务", "warn");
      const ok = await askConfirm(`将当前这一轮 ${task.goalDays} 天全部点亮为「完成」？`);
      if (!ok) return;
      if (!task.marks) task.marks = {};
      currentRoundSlots(task).forEach((slot) => { task.marks[slot.date] = "ok"; });
      const justWon = ensureCompleteFlag();
      save();
      render();
      toast("已全部点亮");
      if (justWon) {
        burstConfetti();
        setTimeout(() => showCertificate(true), 350);
      }
    }

    async function clearAllMarks() {
      const task = state.task;
      if (!task) return toast("请先保存任务", "warn");
      const ok = await askConfirm("清除当前任务的全部打卡标记？");
      if (!ok) return;
      task.marks = {};
      task.completedAt = null;
      save();
      render();
      toast("打卡标记已清除");
    }

    function themeColors() {
      const map = {
        blue: { a: "#d9efff", b: "#f2f8ff", c: "#e7f3ff", main: "#4ea1ff", deep: "#2f7fe0" },
        pink: { a: "#ffe4ef", b: "#fff5f9", c: "#ffeaf3", main: "#ff8fb8", deep: "#f0639a" },
        green: { a: "#d9f7e9", b: "#f3fcf7", c: "#e5f9ef", main: "#3ecf8e", deep: "#22b572" },
        yellow: { a: "#fff0c2", b: "#fffcef", c: "#fff6d6", main: "#f0c42e", deep: "#e0a800" },
        purple: { a: "#e8deff", b: "#f7f3ff", c: "#efe8ff", main: "#9b7aef", deep: "#7b56d9" },
      };
      return map[state.theme] || map.blue;
    }

    function showCertificate(withConfetti) {
      if (!state.task) return;
      drawCertificate(state.task);
      document.getElementById("certModal").classList.remove("hidden");
      if (withConfetti) burstConfetti();
    }

    function drawCertificate(task) {
      const canvas = document.getElementById("certCanvas");
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      const name = babyName();
      const colors = themeColors();
      const font = "PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif";
      const when = task.completedAt ? new Date(task.completedAt) : new Date();
      const title = task.title || "打卡挑战";
      const reward = task.reward || "神秘礼物";

      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, colors.a);
      g.addColorStop(0.5, colors.b);
      g.addColorStop(1, colors.c);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.beginPath(); ctx.arc(160, 240, 56, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(920, 380, 78, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(200, 1240, 68, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(880, 1180, 42, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = colors.main;
      ctx.lineWidth = 12;
      roundRect(ctx, 52, 52, w - 104, h - 104, 44);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255, 214, 90, 0.9)";
      ctx.lineWidth = 4;
      roundRect(ctx, 78, 78, w - 156, h - 156, 36);
      ctx.stroke();

      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";

      ctx.fillStyle = colors.deep;
      ctx.font = `700 78px ${font}`;
      ctx.fillText("荣誉奖状", w / 2, 230);

      ctx.strokeStyle = colorWithAlpha(colors.main, 0.55);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(w / 2 - 120, 268);
      ctx.lineTo(w / 2 + 120, 268);
      ctx.stroke();
      ctx.fillStyle = "#ffd000";
      ctx.font = `48px serif`;
      ctx.fillText("★", w / 2, 286);

      ctx.fillStyle = "#6b8199";
      ctx.font = `500 30px ${font}`;
      ctx.fillText("特此颁发给", w / 2, 360);

      ctx.fillStyle = "#243a55";
      ctx.font = `700 68px ${font}`;
      ctx.fillText(name, w / 2, 450);

      ctx.fillStyle = "#4a6078";
      ctx.font = `500 38px ${font}`;
      const bodyTop = 560;
      const bodyH = wrapText(ctx, `完成「${title}」`, w / 2, bodyTop, w - 260, 56);
      ctx.font = `600 40px ${font}`;
      wrapText(ctx, `连续 ${task.goalDays} 天达成目标`, w / 2, bodyTop + bodyH + 18, w - 260, 58);

      const rewardY = 820;
      const badgeW = Math.min(720, w - 280);
      const badgeX = (w - badgeW) / 2;
      const badgeH = 168;
      const badgeTop = rewardY - 78;

      const badgeGrad = ctx.createLinearGradient(badgeX, badgeTop, badgeX + badgeW, badgeTop + badgeH);
      badgeGrad.addColorStop(0, "#fff7d6");
      badgeGrad.addColorStop(0.45, "#ffe9a0");
      badgeGrad.addColorStop(1, "#ffd978");
      ctx.fillStyle = badgeGrad;
      roundRect(ctx, badgeX, badgeTop, badgeW, badgeH, 84);
      ctx.fill();

      ctx.strokeStyle = "rgba(255, 196, 0, 0.75)";
      ctx.lineWidth = 4;
      roundRect(ctx, badgeX + 8, badgeTop + 8, badgeW - 16, badgeH - 16, 76);
      ctx.stroke();

      ctx.fillStyle = "#ffd000";
      ctx.font = `44px serif`;
      ctx.fillText("★", badgeX + 56, rewardY + 18);
      ctx.fillText("★", badgeX + badgeW - 56, rewardY + 18);

      ctx.fillStyle = "#8a6a10";
      ctx.font = `600 26px ${font}`;
      ctx.fillText("✦  获得奖励  ✦", w / 2, rewardY - 22);

      ctx.fillStyle = colors.deep;
      ctx.font = `700 48px ${font}`;
      wrapText(ctx, reward, w / 2, rewardY + 42, badgeW - 160, 56);

      ctx.fillStyle = "#ffd000";
      ctx.font = `64px serif`;
      ctx.fillText("★  ★  ★  ★  ★", w / 2, 1020);

      ctx.fillStyle = "#7a90a8";
      ctx.font = `500 30px ${font}`;
      ctx.fillText(`日期  ${fmt(when)}`, w / 2, 1140);
      ctx.fillText(`爸爸妈妈为${name}骄傲`, w / 2, 1200);

      ctx.fillStyle = colors.deep;
      ctx.font = `700 36px ${font}`;
      ctx.fillText(`${name}最棒，继续加油！`, w / 2, 1320);
    }

    function colorWithAlpha(hex, alpha) {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!m) return hex;
      return `rgba(${parseInt(m[1], 16)}, ${parseInt(m[2], 16)}, ${parseInt(m[3], 16)}, ${alpha})`;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const chars = text.split("");
      let line = "";
      const lines = [];
      for (let i = 0; i < chars.length; i++) {
        const test = line + chars[i];
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = chars[i];
        } else line = test;
      }
      if (line) lines.push(line);
      lines.forEach((ln, idx) => ctx.fillText(ln, x, y + idx * lineHeight));
      return Math.max(lines.length, 1) * lineHeight;
    }

    function burstConfetti() {
      const box = document.getElementById("confetti");
      box.classList.remove("hidden");
      box.innerHTML = "";
      const colors = [themeColors().main, "#ffe27a", "#ffb4d0", "#7ec2ff", "#b8e0ff"];
      for (let i = 0; i < 48; i++) {
        const el = document.createElement("i");
        el.style.left = Math.random() * 100 + "%";
        el.style.background = colors[i % colors.length];
        el.style.animationDuration = 1.6 + Math.random() * 1.4 + "s";
        el.style.animationDelay = Math.random() * 0.3 + "s";
        box.appendChild(el);
      }
      setTimeout(() => {
        box.classList.add("hidden");
        box.innerHTML = "";
      }, 3200);
    }

    function codeDigits(inputs) {
      return Array.from(inputs).map((el) => el.value.replace(/\D/g, "").slice(-1)).join("");
    }
    function clearCodeBoxes(inputs) {
      inputs.forEach((el) => { el.value = ""; });
    }
    function bindCodeBoxes(inputs, { onComplete, password = false } = {}) {
      const list = Array.from(inputs);
      list.forEach((input, idx) => {
        if (password) input.type = "password";
        input.addEventListener("input", () => {
          const raw = input.value.replace(/\D/g, "");
          if (raw.length > 1) {
            const chars = raw.slice(0, list.length - idx).split("");
            chars.forEach((ch, i) => { if (list[idx + i]) list[idx + i].value = ch; });
            const next = list[Math.min(idx + chars.length, list.length - 1)];
            next.focus();
          } else {
            input.value = raw.slice(-1);
            if (input.value && list[idx + 1]) list[idx + 1].focus();
          }
          const code = codeDigits(list);
          if (code.length === list.length && onComplete) onComplete(code);
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !input.value && list[idx - 1]) {
            list[idx - 1].focus();
            list[idx - 1].value = "";
            e.preventDefault();
          }
        });
        input.addEventListener("focus", () => input.select());
      });
    }

    function openLockModal() {
      const boxes = document.querySelectorAll(".lock-digit");
      const wrap = document.getElementById("lockBoxes");
      document.getElementById("lockError").textContent = "";
      wrap.classList.remove("shake");
      clearCodeBoxes(boxes);
      document.getElementById("lockModal").classList.remove("hidden");
      setTimeout(() => boxes[0]?.focus(), 50);
    }
    function closeLockModal() {
      document.getElementById("lockModal").classList.add("hidden");
      clearCodeBoxes(document.querySelectorAll(".lock-digit"));
      document.getElementById("lockError").textContent = "";
    }
    function tryUnlock(code) {
      if (code === (state.lockCode || DEFAULT_LOCK_CODE)) {
        parentUnlocked = true;
        closeLockModal();
        mode = "parent";
        render();
        return;
      }
      const wrap = document.getElementById("lockBoxes");
      const boxes = document.querySelectorAll(".lock-digit");
      document.getElementById("lockError").textContent = "密码不对，再试一次";
      wrap.classList.remove("shake");
      void wrap.offsetWidth;
      wrap.classList.add("shake");
      clearCodeBoxes(boxes);
      boxes[0].focus();
    }

    document.getElementById("btnChild").onclick = () => { mode = "child"; render(); };
    document.getElementById("btnParent").onclick = () => {
      if (parentUnlocked) { mode = "parent"; render(); return; }
      openLockModal();
    };
    document.getElementById("lockCancel").onclick = closeLockModal;
    document.getElementById("lockModal").addEventListener("click", (e) => {
      if (e.target.id === "lockModal") closeLockModal();
    });
    bindCodeBoxes(document.querySelectorAll(".lock-digit"), {
      password: true,
      onComplete: tryUnlock,
    });
    bindCodeBoxes(document.querySelectorAll(".lock-set-digit"), { password: true });

    document.getElementById("themeGrid").onclick = (e) => {
      const chip = e.target.closest(".theme-chip");
      if (!chip) return;
      applyTheme(chip.getAttribute("data-theme"));
      save();
    };

    document.getElementById("saveProfile").onclick = () => {
      state.profile = {
        nickname: document.getElementById("babyName").value.trim() || DEFAULT_NICKNAME,
      };
      save();
      updateChromeCopy();
      toast("宝宝设置已保存");
      render();
    };

    document.getElementById("startDate").addEventListener("change", updateRangePreview);
    document.getElementById("goalDays").addEventListener("input", updateRangePreview);

    document.getElementById("saveTask").onclick = () => {
      const title = document.getElementById("taskTitle").value.trim() || "打卡挑战";
      const reward = document.getElementById("rewardName").value.trim() || "心愿奖励";
      const startDate = document.getElementById("startDate").value || todayStr();
      const goalDays = Math.min(60, Math.max(3, Number(document.getElementById("goalDays").value) || 10));
      const keepMarks = state.task && state.task.startDate === startDate ? (state.task.marks || {}) : {};
      state.task = { title, reward, startDate, goalDays, marks: keepMarks, completedAt: null };
      ensureCompleteFlag();
      save();
      toast("任务已保存");
      render();
    };

    document.getElementById("resetAll").onclick = async () => {
      const ok = await askConfirm("确定清空全部任务与打卡记录？宝宝设置与皮肤会保留。");
      if (!ok) return;
      const keep = {
        lockCode: state.lockCode,
        theme: state.theme,
        profile: state.profile,
      };
      state = { ...defaultState(), ...keep, task: null };
      save();
      parentUnlocked = true;
      render();
      toast("已清空任务与打卡记录");
    };

    document.getElementById("saveLock").onclick = () => {
      const v = codeDigits(document.querySelectorAll(".lock-set-digit"));
      if (!/^\d{4}$/.test(v)) return toast("请输入完整的 4 位数字", "warn");
      state.lockCode = v;
      save();
      clearCodeBoxes(document.querySelectorAll(".lock-set-digit"));
      toast("童锁已更新");
    };

    document.getElementById("askCancel").onclick = () => closeAsk(false);
    document.getElementById("askOk").onclick = () => closeAsk(true);
    document.getElementById("askMask").addEventListener("click", (e) => {
      if (e.target.id === "askMask") closeAsk(false);
    });

    document.getElementById("fillAllOk").onclick = fillAllOk;
    document.getElementById("clearAllMarks").onclick = clearAllMarks;
    document.getElementById("previewCert").onclick = () => {
      if (!state.task) return toast("请先保存任务", "warn");
      showCertificate(false);
    };
    document.getElementById("closeCert").onclick = () => {
      document.getElementById("certModal").classList.add("hidden");
    };
    document.getElementById("saveCert").onclick = () => {
      const a = document.createElement("a");
      a.href = document.getElementById("certCanvas").toDataURL("image/png");
      a.download = `打卡奖状-${babyName()}-${todayStr()}.png`;
      a.click();
    };

    applyTheme(state.theme);
    render();
  </script>
</body>
</html>
